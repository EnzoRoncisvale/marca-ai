<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Marca Aí! - Login & Cadastro de Atleta</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="app.css">
  <link rel="shortcut icon" href="assets/img/marca-ai-short.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.12) 0px, transparent 50%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      color: #0f172a;
    }

    .auth-wrapper {
      max-width: 420px;
      width: 100%;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-logo {
      height: 44px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .auth-logo:hover {
      transform: scale(1.04);
    }

    .auth-tagline {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.35rem;
      font-weight: 500;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    /* Alternador de Abas (Entrar / Criar Conta) */
    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 1.5rem;
      gap: 4px;
    }

    .auth-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.65rem 0.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      color: #64748b;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-tab.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Formulários */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: #94a3b8;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .form-input-custom {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-input-custom:focus {
      outline: none;
      background: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
    }

    .password-toggle-btn:hover {
      color: #334155;
    }

    .btn-auth-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-auth-submit:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
    }

    .auth-footer-help {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.75rem;
    }

    .auth-footer-help a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }

    .guest-link-box {
      text-align: center;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #f1f5f9;
    }

    .guest-link {
      font-size: 0.8rem;
      color: #64748b;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .guest-link:hover {
      color: #0f172a;
    }

    /* Animação suave entre abas */
    .auth-form-pane {
      display: none;
      animation: fadeInPane 0.2s ease-in-out;
    }

    .auth-form-pane.active {
      display: block;
    }

    @keyframes fadeInPane {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <a href="index.html">
        <img src="assets/img/marca-ai-logo.svg" alt="Marca Aí! Logo" class="auth-logo" onerror="this.src='assets/img/Marca A! Logo.svg'">
      </a>
      <p class="auth-tagline">Rachas e quadras públicas na sua área</p>
    </div>

    <div class="auth-card">
      <!-- Alternador de Abas -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="btn-tab-login" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
        </button>
        <button type="button" class="auth-tab" id="btn-tab-register" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Criar Conta
        </button>
      </div>

      <!-- ABA 1: LOGIN SIMPLIFICADO (E-mail ou Usuário + Senha) -->
      <form id="form-login" class="auth-form-pane active" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-identifier">E-mail ou Nome de Usuário</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="login-identifier" class="form-input-custom" placeholder="ex: felipe ou seu@email.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Senha</label>
            <a href="#" onclick="alert('Simulação: um link de recuperação foi enviado ao seu e-mail!'); return false;" style="font-size: 0.725rem; color: #10b981; font-weight: 600; text-decoration: none;">Esqueceu?</a>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="login-password" class="form-input-custom" placeholder="Sua senha secreta" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btn-submit-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Entrar no Marca Aí!</span>
        </button>
      </form>

      <!-- ABA 2: CADASTRO ENXUTO (Nome de Usuário + E-mail + Senha) -->
      <form id="form-register" class="auth-form-pane" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="reg-username">Nome de Usuário / Apelido no Jogo *</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-badge input-icon"></i>
            <input type="text" id="reg-username" class="form-input-custom" placeholder="Ex: Felipe Canhoto" required autocomplete="name">
          </div>
          <span style="font-size: 0.7rem; color: #64748b; margin-top: 0.25rem; display: block;">Como outros peladeiros vão te ver na escalação.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Seu E-mail *</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="form-input-custom" placeholder="seu@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Crie uma Senha *</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-input-custom" placeholder="Mínimo 6 dígitos" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btn-submit-register">
          <i class="fa-solid fa-user-plus"></i>
          <span>Criar Conta e Jogar</span>
        </button>
      </form>

      <!-- Acesso Rápido como Convidado -->
      <div class="guest-link-box">
        <a href="index.html" class="guest-link">
          <span>Continuar explorando como visitante</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Alterna entre abas de Entrar e Criar Conta
    function switchAuthTab(tab) {
      const tabLogin = document.getElementById("btn-tab-login");
      const tabRegister = document.getElementById("btn-tab-register");
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");

      if (tab === "register") {
        tabLogin.classList.remove("active");
        tabRegister.classList.add("active");
        formLogin.classList.remove("active");
        formRegister.classList.add("active");
        document.getElementById("reg-username").focus();
      } else {
        tabRegister.classList.remove("active");
        tabLogin.classList.add("active");
        formRegister.classList.remove("active");
        formLogin.classList.add("active");
        document.getElementById("login-identifier").focus();
      }
    }

    // Mostrar/ocultar senha
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    // Processa Login
    function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById("login-identifier").value.trim();
      const submitBtn = document.getElementById("btn-submit-login");
      
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
      submitBtn.disabled = true;

      // Recupera ou cria perfil baseado no login fornecido
      const existing = localStorage.getItem("marca_ai_user");
      let user = existing ? JSON.parse(existing) : null;

      if (!user || user.name.toLowerCase() !== identifier.toLowerCase()) {
        const isEmail = identifier.includes("@");
        const displayName = isEmail ? identifier.split("@")[0] : identifier;
        const initials = displayName.substring(0, 2).toUpperCase();

        user = {
          id: "usr-" + Date.now(),
          name: displayName,
          email: isEmail ? identifier : `${identifier}@marca-ai.app`,
          avatar: initials || "AT",
          position: "Jogador Geral",
          karma: "5.0 ★",
          gamesPlayed: 1,
          phone: "(61) 98888-7777"
        };
      }

      localStorage.setItem("marca_ai_user", JSON.stringify(user));

      setTimeout(() => {
        window.location.href = "index.html";
      }, 400);
    }

    // Processa Cadastro Enxuto
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const submitBtn = document.getElementById("btn-submit-register");

      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando perfil...';
      submitBtn.disabled = true;

      const words = username.split(" ").filter(Boolean);
      let initials = "AT";
      if (words.length >= 2) {
        initials = (words[0][0] + words[1][0]).toUpperCase();
      } else if (words.length === 1) {
        initials = words[0].substring(0, 2).toUpperCase();
      }

      const newUser = {
        id: "usr-" + Date.now(),
        name: username,
        email: email,
        avatar: initials,
        position: "Jogador Geral",
        karma: "5.0 ★",
        gamesPlayed: 0,
        phone: ""
      };

      localStorage.setItem("marca_ai_user", JSON.stringify(newUser));

      setTimeout(() => {
        window.location.href = "index.html";
      }, 500);
    }

    // Verifica parâmetro da URL (?tab=register)
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("tab") === "register") {
        switchAuthTab("register");
      }
    });
  </script>
</body>
</html>
