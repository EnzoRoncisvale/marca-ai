<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marca Aí! - Cadastro de Atleta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="app.css">
  <link rel="shortcut icon" href="assets/img/marca-ai-short.svg" type="image/svg+xml">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .auth-logo {
      height: 48px;
      display: block;
      margin: 0 auto;
    }
    .auth-header {
      text-align: center;
    }
    .auth-header h1 {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--dark-900);
      font-weight: 800;
    }
    .auth-header p {
      font-size: 0.875rem;
      color: var(--dark-600);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html">
      <img src="assets/img/marca-ai-logo.svg" alt="Marca Aí! Logo" class="auth-logo" onerror="this.src='assets/img/Marca A! Logo.svg'">
    </a>

    <div class="auth-header">
      <h1>Crie seu Perfil de Atleta</h1>
      <p>Nunca mais fique de fora das peladas da sua cidade.</p>
    </div>

    <form id="register-form" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label class="form-label">Nome Completo / Apelido no Jogo *</label>
        <input type="text" class="form-input" id="reg-name" placeholder="Ex: Felipe 'Canhoto'" required>
      </div>

      <div class="form-group">
        <label class="form-label">E-mail *</label>
        <input type="email" class="form-input" id="reg-email" placeholder="seu@email.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">WhatsApp (para confirmação) *</label>
          <input type="text" class="form-input" id="reg-phone" placeholder="(61) 98765-4321" required>
        </div>

        <div class="form-group">
          <label class="form-label">Posição Preferida *</label>
          <select class="form-select" id="reg-position" required>
            <option value="Meio-Campo">Meio-Campo</option>
            <option value="Goleiro">Goleiro (Muralha)</option>
            <option value="Atacante">Atacante / Pivô</option>
            <option value="Zagueiro">Zagueiro / Fixo</option>
            <option value="Lateral">Lateral / Ala</option>
            <option value="Levantador">Levantador (Vôlei)</option>
            <option value="Jogador Geral">Jogador Geral</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Senha de Acesso *</label>
        <input type="password" class="form-input" id="reg-password" minlength="6" placeholder="Mínimo 6 dígitos" required>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-user-plus"></i>
        <span>Cadastrar e Começar a Jogar</span>
      </button>
    </form>

    <div style="text-align: center; font-size: 0.85rem; color: var(--dark-600);">
      Já tem uma conta? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Faça login</a>
    </div>
  </div>

  <script>
    document.getElementById("register-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const position = document.getElementById("reg-position").value;

      const initials = name.split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();

      const user = {
        id: "usr-" + Date.now(),
        name: name,
        email: email,
        avatar: initials || "AT",
        position: position,
        karma: "5.0 ★ (Novo)",
        gamesPlayed: 0,
        phone: phone
      };

      localStorage.setItem("marca_ai_user", JSON.stringify(user));
      alert(`Bem-vindo ao Marca Aí, ${name}! Seu perfil de atleta foi criado com sucesso.`);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
